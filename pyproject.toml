[project]
name = "dbide"
version = "0.1.0"
description = "A local desktop IDE for SQLite and MySQL/MariaDB databases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "keyring>=25",
    "bcrypt>=5.0.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "sqlglot>=30.34.0",
    "qtawesome>=1.4.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
dbide = "dbide.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
